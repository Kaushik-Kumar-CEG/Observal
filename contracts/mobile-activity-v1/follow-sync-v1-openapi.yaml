openapi: 3.1.0
info:
  title: Observal account-owned mobile follows (PROPOSAL ONLY)
  version: 1.0.1-proposal
  description: >-
    Separate from accepted activity v1.2. No endpoint is live or accepted until
    exact proposal+schema+vector hashes receive Android AGREE. No redirects
    on authenticated routes. No follow can authorize any activity scope.
servers:
  - url: /api/v1
paths:
  /mobile-follow-sync/v1/availability:
    get:
      operationId: followSyncAvailability
      security: [{mobileRead: []}]
      responses:
        '200': {description: Exact extension and consent state, content: {application/json: {schema: {$ref: '#/components/schemas/Availability'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Restricted'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /mobile-follow-sync/v1/consent:
    post:
      operationId: consentToAccountFollows
      security: [{mobileRead: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ConsentRequest'}}}}
      responses:
        '200': {description: Account consent recorded, content: {application/json: {schema: {$ref: '#/components/schemas/ConsentState'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Restricted'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /mobile-follow-sync/v1/write-authorization:
    post:
      operationId: requestExplicitBrowserFollowWriteApproval
      security: [{mobileRead: []}]
      description: One-use code bound to issuing server, account, device, project and cohort. No token in browser URL.
      responses:
        '200': {description: Short browser challenge, content: {application/json: {schema: {$ref: '#/components/schemas/WriteApprovalChallenge'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Restricted'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /mobile-follow-sync/v1/write-approval:
    post:
      operationId: browserApproveFollowWriteForThisDevice
      security: [{browserBearer: []}]
      description: Desktop/browser session only. Requires explicit displayed scope consent; mobile read token cannot call this route. Code identifies prior challenge, not an access token redirect.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WriteApprovalRequest'}}}}
      responses:
        '200': {description: Scoped approval stored for the named mobile device, content: {application/json: {schema: {$ref: '#/components/schemas/WriteApprovalState'}}}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Restricted'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /mobile-follow-sync/v1/write-grant:
    post:
      operationId: mintSeparateFollowWriteGrant
      security: [{mobileRead: []}]
      description: Server re-verifies mobile read JWT, account/device/cohort/revocation, consent AND independently browser-approved scoped write authorization; no body. A stolen mobile read JWT from an unapproved device cannot bootstrap write authority. No refresh token for this grant.
      responses:
        '200': {description: Five-minute unrefreshable allowlisted write JWT, content: {application/json: {schema: {$ref: '#/components/schemas/WriteGrant'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Restricted'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /mobile-follow-sync/v1/snapshot:
    get:
      operationId: pagedAccountFollows
      security: [{mobileRead: []}]
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Owner-only keyset page bound to one revision, content: {application/json: {schema: {$ref: '#/components/schemas/SnapshotPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Restricted'}
        '409': {$ref: '#/components/responses/StaleSnapshot'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /mobile-follow-sync/v1/changes:
    get:
      operationId: pagedAccountFollowDeltas
      security: [{mobileRead: []}]
      parameters:
        - {name: after_revision, in: query, required: true, schema: {type: integer, minimum: 0, maximum: 9223372036854775807}}
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Ordered revision plus change_ordinal keyset page, content: {application/json: {schema: {$ref: '#/components/schemas/ChangesPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Restricted'}
        '409': {$ref: '#/components/responses/StaleSnapshot'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /mobile-follow-sync/v1/operations:
    post:
      operationId: conditionalSingleFollowEdit
      security: [{followWrite: []}]
      description: Exactly one person per request. Success or 409 conflict is durably stored with the op ID; exact repeat returns identical HTTP status and body (no replay flag). No full-list upload. No redirect.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FollowOperation'}}}}
      responses:
        '200': {description: Conditional operation applied, content: {application/json: {schema: {$ref: '#/components/schemas/AppliedOperation'}}}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Restricted'}
        '409': {description: Per-person conflict or reused ID with different body, content: {application/json: {schema: {$ref: '#/components/schemas/OperationConflict'}}}}
        '413': {$ref: '#/components/responses/TooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /mobile-follow-sync/v1/operations/{operation_id}:
    get:
      operationId: locateFollowEditOutcome
      security: [{mobileRead: []}]
      parameters: [{$ref: '#/components/parameters/OperationId'}]
      responses:
        '200': {description: Stored applied/conflict outcome, content: {application/json: {schema: {$ref: '#/components/schemas/OperationOutcome'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Restricted'}
        '404': {description: Unknown ID; NOT proof an ambiguous dispatched operation did not commit, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '410': {description: Dedup retention expired; fetch fresh snapshot before any explicit rebase, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /mobile-follow-sync/v1/removals/prepare:
    post:
      operationId: prepareAccountFollowRemoval
      security: [{followWrite: []}]
      description: Re-prove current device/cohort and explicit account-wide confirmation; not phone unlink or logout. No body. Nonce expires within 120 seconds.
      responses:
        '200': {description: Bound one-time confirmation, content: {application/json: {schema: {$ref: '#/components/schemas/RemovalChallenge'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Restricted'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /mobile-follow-sync/v1/removals:
    post:
      operationId: removeAllAccountFollows
      security: [{followWrite: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RemovalRequest'}}}}
      responses:
        '202': {description: Durable owner fence; NOT completed until status says completed, content: {application/json: {schema: {$ref: '#/components/schemas/RemovalState'}}}}
        '400': {$ref: '#/components/responses/Invalid'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Restricted'}
        '409': {$ref: '#/components/responses/StaleSnapshot'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /mobile-follow-sync/v1/removals/{removal_id}:
    get:
      operationId: getAccountFollowRemovalStatus
      security: [{mobileRead: []}]
      parameters: [{$ref: '#/components/parameters/RemovalId'}]
      responses:
        '200': {description: Owner-only durable completion status; no partial list, content: {application/json: {schema: {$ref: '#/components/schemas/RemovalState'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Restricted'}
        '404': {$ref: '#/components/responses/Unknown'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /mobile-follow-sync/v1/export:
    get:
      operationId: exportAccountFollows
      security: [{mobileRead: []}]
      description: Current owner, per-partition, paged subject UUID bookmarks only; no names, roles, trace, credential or per-person period.
      parameters:
        - {$ref: '#/components/parameters/PageLimit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Privacy export page, content: {application/json: {schema: {$ref: '#/components/schemas/SnapshotPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Restricted'}
        '409': {$ref: '#/components/responses/StaleSnapshot'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    mobileRead: {type: http, scheme: bearer, bearerFormat: JWT, description: Exact accepted v1.2 mobile:read audience, NOT general API write authority.}
    followWrite: {type: http, scheme: bearer, bearerFormat: JWT, description: Separate unrefreshable mobile:follow-write audience, ONLY operations/removals.}
    browserBearer: {type: http, scheme: bearer, bearerFormat: JWT, description: Normal current browser/desktop account session, never a mobile JWT.}
  parameters:
    PageLimit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    Cursor: {name: cursor, in: query, required: false, schema: {type: string, minLength: 1, maxLength: 2048, pattern: '^[A-Za-z0-9_.~-]+$'}}
    OperationId: {name: operation_id, in: path, required: true, schema: {type: string, format: uuid}}
    RemovalId: {name: removal_id, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    WriteApprovalChallenge:
      type: object
      additionalProperties: false
      required: [user_code, verification_uri, verification_origins, expires_in]
      properties:
        user_code: {type: string, minLength: 6, maxLength: 32}
        verification_uri: {type: string, format: uri, pattern: '^https://', maxLength: 2048}
        verification_origins: {type: array, minItems: 1, maxItems: 1, items: {type: string, format: uri, pattern: '^https://', maxLength: 512}}
        expires_in: {type: integer, minimum: 1, maximum: 600}
    WriteApprovalRequest:
      type: object
      additionalProperties: false
      required: [user_code, approve]
      properties:
        user_code: {type: string, minLength: 6, maxLength: 32}
        approve: {type: boolean, const: true}
    WriteApprovalState:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: {type: string, const: approved}
    Availability:
      type: object
      additionalProperties: false
      required: [version, state, server_id, project_id, viewer_id, cohort, max_page_size, offline_horizon_days]
      properties:
        version: {type: string, const: '1.0.1'}
        state: {type: string, enum: [available, disabled, consent_required, restricted]}
        server_id: {type: string, format: uuid}
        project_id: {type: string}
        viewer_id: {type: string, format: uuid}
        cohort: {type: string, enum: [live, synthetic]}
        max_page_size: {type: integer, const: 100}
        offline_horizon_days: {type: integer, const: 30}
    ConsentRequest:
      type: object
      additionalProperties: false
      required: [consent]
      properties:
        consent: {type: boolean, const: true}
    ConsentState:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: {type: string, const: available}
    WriteGrant:
      type: object
      additionalProperties: false
      required: [token_type, access_token, expires_in, client_id, audience, scope]
      properties:
        token_type: {type: string, const: bearer}
        access_token: {type: string, minLength: 32, maxLength: 8192}
        expires_in: {type: integer, minimum: 1, maximum: 300}
        client_id: {type: string, const: observal-mobile}
        audience: {type: string, const: observal-mobile-follow-sync-v1}
        scope: {type: string, const: 'mobile:follow-write'}
    Bookmark:
      type: object
      additionalProperties: false
      required: [subject_id, person_revision]
      properties:
        subject_id: {type: string, format: uuid}
        person_revision: {type: integer, minimum: 1, maximum: 9223372036854775807}
    SnapshotPage:
      type: object
      additionalProperties: false
      required: [server_id, project_id, viewer_id, cohort, revision, items, next_cursor, complete]
      properties:
        server_id: {type: string, format: uuid}
        project_id: {type: string}
        viewer_id: {type: string, format: uuid}
        cohort: {type: string, enum: [live, synthetic]}
        revision: {type: integer, minimum: 0, maximum: 9223372036854775807}
        items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Bookmark'}}
        next_cursor: {type: [string, 'null'], maxLength: 2048}
        complete: {type: boolean}
    Change:
      type: object
      additionalProperties: false
      required: [subject_id, action, person_revision, revision, change_ordinal]
      properties:
        subject_id: {type: string, format: uuid}
        action: {type: string, enum: [follow, unfollow]}
        person_revision: {type: integer, minimum: 1, maximum: 9223372036854775807}
        revision: {type: integer, minimum: 1, maximum: 9223372036854775807}
        change_ordinal: {type: integer, minimum: 0, maximum: 9223372036854775807}
    ChangesPage:
      description: The revision is the fixed INCLUSIVE upper bound chosen on the first page and remains identical on every page; client checkpoints it only when complete. Owner erasure invalidates prior after_revision and signed cursors with 409 snapshot_required.
      type: object
      additionalProperties: false
      required: [revision, changes, next_cursor, complete]
      properties:
        revision: {type: integer, minimum: 0, maximum: 9223372036854775807}
        changes: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Change'}}
        next_cursor: {type: [string, 'null'], maxLength: 2048}
        complete: {type: boolean}
    FollowOperation:
      type: object
      additionalProperties: false
      required: [operation_id, subject_id, base_person_revision, action]
      properties:
        operation_id: {type: string, format: uuid}
        subject_id: {type: string, format: uuid}
        base_person_revision: {type: integer, minimum: 0, maximum: 9223372036854775807}
        action: {type: string, enum: [follow, unfollow]}
    AppliedOperation:
      type: object
      additionalProperties: false
      required: [operation_id, subject_id, revision, person_revision, status]
      properties:
        operation_id: {type: string, format: uuid}
        subject_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1, maximum: 9223372036854775807}
        person_revision: {type: integer, minimum: 1, maximum: 9223372036854775807}
        status: {type: string, const: applied}
    OperationConflict:
      type: object
      additionalProperties: false
      required: [error, operation_id, revision, person_revision]
      properties:
        error: {type: string, enum: [person_conflict, operation_id_reused, capacity_reached]}
        operation_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 0, maximum: 9223372036854775807}
        person_revision: {type: integer, minimum: 0, maximum: 9223372036854775807}
        current_following: {type: boolean, description: Authoritative account-owned current state of caller-submitted UUID, even when absent from active snapshot.}
      if: {properties: {error: {const: person_conflict}}, required: [error]}
      then: {required: [current_following]}
    OperationOutcome:
      type: object
      additionalProperties: false
      required: [operation_id, http_status, result]
      properties:
        operation_id: {type: string, format: uuid}
        http_status: {type: integer, enum: [200, 409]}
        result: {oneOf: [{$ref: '#/components/schemas/AppliedOperation'}, {$ref: '#/components/schemas/OperationConflict'}]}
    RemovalChallenge:
      type: object
      additionalProperties: false
      required: [nonce, expires_in, server_id, project_id, viewer_id, cohort]
      properties:
        nonce: {type: string, minLength: 24, maxLength: 256}
        expires_in: {type: integer, minimum: 1, maximum: 120}
        server_id: {type: string, format: uuid}
        project_id: {type: string}
        viewer_id: {type: string, format: uuid}
        cohort: {type: string, enum: [live, synthetic]}
    RemovalRequest:
      type: object
      additionalProperties: false
      required: [nonce, confirm]
      properties:
        nonce: {type: string, minLength: 24, maxLength: 256}
        confirm: {type: boolean, const: true}
    RemovalState:
      type: object
      additionalProperties: false
      required: [removal_id, state, revision]
      properties:
        removal_id: {type: string, format: uuid}
        state: {type: string, enum: [pending, needs_operator, completed]}
        revision: {type: integer, minimum: 0, maximum: 9223372036854775807}
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {type: string, enum: [invalid_request, unauthorized, restricted, stale_snapshot, snapshot_required, unknown_operation, dedup_expired, unknown_removal, removal_pending, unavailable, rate_limited, too_large]}
  responses:
    Invalid: {description: Invalid schema or immutable command, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: Missing/expired/wrong audience or revoked device/account; no details, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Restricted: {description: Wrong owner/server/project/cohort or missing consent; no identifiers, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    StaleSnapshot: {description: stale_snapshot or snapshot_required; full restart, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    TooLarge: {description: Body exceeds 4096 bytes, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    RateLimited: {description: Fair account/device limit, Retry-After header integer seconds 1..60, headers: {Retry-After: {schema: {type: integer, minimum: 1, maximum: 60}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unavailable: {description: Offline, barrier closed, Redis unavailable, or removal_pending; never infer empty list, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unknown: {description: Unknown removal identifier, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
