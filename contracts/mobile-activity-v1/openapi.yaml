openapi: 3.1.0
info:
  title: Observal mobile trace-first activity (backend negotiation ONLY)
  version: 1.1.0-draft
  description: >-
    Backend-owned trace-first replacement for the UNDEPLOYED calls-oriented v1
    draft. Some read-only v1 paths exist in a separate gated branch, but do not
    satisfy this revised shape; no trace_headlines cohort is qualified or
    deployed. A headline is one qualified component-attributable logical-root
    run, NOT a call or a prompted general session. Mobile-owner review required.
servers:
  - url: /api/v1
security:
  - mobileBearer: []
paths:
  /auth/device/authorize:
    post:
      operationId: authorizeMobileDevice
      security: []
      description: Explicit client_id=observal-mobile; issuance disabled by default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [client_id]
              properties:
                client_id: { type: string, const: observal-mobile }
                sso: { type: boolean, default: false }
                provider: { type: [string, 'null'] }
      responses:
        '200': { description: One-use device challenge, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceChallenge' } } } }
        '503': { description: Mobile issuance disabled or unavailable. }
  /auth/device/token:
    post:
      operationId: redeemMobileDeviceGrant
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_code, grant_type]
              properties:
                device_code: { type: string }
                grant_type: { type: string, const: 'urn:ietf:params:oauth:grant-type:device_code' }
      responses:
        '200': { description: One-use mobile audience grant, content: { application/json: { schema: { $ref: '#/components/schemas/MobileDeviceToken' } } } }
        '400': { description: Pending, denied, expired or already consumed. }
        '503': { description: Mobile issuance disabled or unavailable. }
  /auth/token/refresh:
    post:
      operationId: rotateMobileRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200': { description: Atomically rotated mobile-audience pair, content: { application/json: { schema: { $ref: '#/components/schemas/MobileTokenPair' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Mobile disabled or unavailable. }
  /auth/mobile/credential:
    get:
      operationId: verifyMobileCredential
      description: >-
        Call over the selected HTTPS origin with the newly issued access token
        after device redemption and every refresh, before persisting a credential
        pair. The server verifies signature, exact audience/read-only scope,
        device family, user state and Redis revocation. Never trust JWT fields
        decoded without verification as evidence of a mobile-only grant.
      responses:
        '200': { description: Authenticated mobile credential proof, content: { application/json: { schema: { $ref: '#/components/schemas/MobileCredentialProof' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Restricted' }
        '503': { description: Mobile authentication disabled or unavailable. }
  /auth/mobile/logout:
    post:
      operationId: logoutMobileDevice
      description: Revoke only the phone's device family; allowed after issuance is disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200': { description: Device family revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /mobile-activity/v1/capabilities:
    get:
      operationId: mobileActivityCapabilities
      description: >-
        Advertise trace_headlines=true ONLY after verified run identity, indexed
        retained evidence, read controls, scoped mobile auth and a running-instance
        cohort pass. The draft example is false. Caller HTTPS origin is part of identity.
      responses:
        '200': { description: Capability, content: { application/json: { schema: { $ref: '#/components/schemas/Capabilities' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /mobile-activity/v1/people:
    get:
      operationId: mobilePeopleDirectory
      description: Public active identity only; no email, role or activity permission from following.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 64 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Paged public identity, content: { application/json: { schema: { $ref: '#/components/schemas/PeoplePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /mobile-activity/v1/people/resolve:
    post:
      operationId: mobileResolveBookmarkedPeople
      description: Identity-only cold-start resolution; omit deleted/hidden IDs without old name, role or activity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject_ids]
              properties:
                subject_ids: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { type: string, format: uuid } }
      responses:
        '200': { description: Visible identity subset, content: { application/json: { schema: { $ref: '#/components/schemas/PeoplePage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /mobile-activity/v1/people/summaries:
    post:
      operationId: mobilePairedViewport
      description: >-
        Bounded paired Author/User readings for a subject viewport. Maintainers
        can read both scopes; ordinary viewers may read only their own User
        scope. In mixed batches each forbidden scope is {status: restricted},
        without value, coverage, reason, cohort, or revision metadata; absent
        and forbidden other-subject IDs are identical to ordinary viewers.
        A batch with no authorized scope is bodyless 403. Both scopes for one
        subject have identical server-pinned window bounds.
        A window_anchor may be reused for subsequent capped batches under the
        same viewer, project and period; not an arbitrary-time filter. It pins
        time only, not global evidence generation. Expiry/project/viewer changes
        return stale_window; affected subject/scope revision changes return
        stale_cursor, without invalidating unrelated subjects.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PairedRequest' }
      responses:
        '200': { description: Bounded paired readings, content: { application/json: { schema: { $ref: '#/components/schemas/PairedBatch' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Restricted' }
        '409': { $ref: '#/components/responses/Stale' }
        '429': { description: Rate limited }
  /mobile-activity/v1/people/{subject_id}/summary:
    get:
      operationId: mobilePersonScopeSummary
      description: >-
        Self User or trace-privileged maintainer Author/User. Reauthorize each
        request. Author general sessions are redacted unavailable; User sessions
        are a separate prompted-root measure. Caller cannot select arbitrary time.
      parameters:
        - { $ref: '#/components/parameters/Subject' }
        - { $ref: '#/components/parameters/Period' }
        - { $ref: '#/components/parameters/Scope' }
        - { $ref: '#/components/parameters/WindowAnchor' }
      responses:
        '200': { description: One scope, content: { application/json: { schema: { $ref: '#/components/schemas/PersonSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Restricted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Stale' }
  /mobile-activity/v1/people/{subject_id}/{scope}/components:
    get:
      operationId: mobileComponentReachPage
      description: >-
        Subject/scope/window-bound authorized rows sorted by distinct root reach,
        then stable component ID. Rows may overlap; never sum them into the union.
        A cursor must reach a last page despite unrelated writes or this endpoint
        must report complete=false and cannot pass full Gate 2.
      parameters:
        - { $ref: '#/components/parameters/Subject' }
        - { $ref: '#/components/parameters/ScopePath' }
        - { $ref: '#/components/parameters/Period' }
        - { $ref: '#/components/parameters/WindowAnchorRequired' }
        - { $ref: '#/components/parameters/ExpectedRevision' }
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Scoped overlapping rows, content: { application/json: { schema: { $ref: '#/components/schemas/ComponentPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Restricted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Stale' }
  /mobile-activity/v1/people/{subject_id}/{scope}/components/{kind}/{component_id}:
    get:
      operationId: mobileScopedComponentDetail
      description: >-
        Recheck viewer/subject/scope, current visibility, generation and listing
        membership. Author requires original submitter plus approval AT event time;
        independently authorized private/pending self User use does not require
        public approval. Direct component ID confers no access.
      parameters:
        - { $ref: '#/components/parameters/Subject' }
        - { $ref: '#/components/parameters/ScopePath' }
        - { $ref: '#/components/parameters/Period' }
        - { $ref: '#/components/parameters/WindowAnchorRequired' }
        - { $ref: '#/components/parameters/ExpectedRevision' }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [mcp, skill, hook] } }
        - { name: component_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Qualified scoped detail, content: { application/json: { schema: { $ref: '#/components/schemas/ComponentDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Restricted' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Stale' }
  /mobile-activity/v1/published:
    get:
      operationId: mobilePublishedByMe
      description: Paged currently visible approved original submissions, not activity or a permission grant.
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Published by original author, content: { application/json: { schema: { $ref: '#/components/schemas/PublishedPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /mobile-activity/v1/platform/overview:
    get:
      operationId: mobilePlatformOverview
      description: >-
        Trace-privileged viewer only. Completed UTC-day window, no subject or
        arbitrary-time filter. Distinct non-deleted active accounts and prompted
        root runs independently counted, not summed from cards or component calls.
        Suppress BOTH below ten accounts or unqualified source with identical
        fully redacted nulls; timing must not distinguish suppressed cohorts.
      parameters:
        - { $ref: '#/components/parameters/Period' }
      responses:
        '200': { description: Privacy-screened independent platform context, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformOverview' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Restricted' }
components:
  securitySchemes:
    mobileBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Centrally enforced read-only mobile audience/scope, including REST, GraphQL
        and WebSocket denial of unrelated routes; refresh keeps scope and logout
        revokes only this phone. Device/SSO issuance DTOs remain a Gate 0 agreement
        with the separate unmerged scoped-auth branch, not a shipped flow.
  parameters:
    Subject: { name: subject_id, in: path, required: true, schema: { type: string, format: uuid } }
    Scope: { name: scope, in: query, required: true, schema: { type: string, enum: [author, user] } }
    ScopePath: { name: scope, in: path, required: true, schema: { type: string, enum: [author, user] } }
    Period: { name: period, in: query, required: true, schema: { type: string, enum: [1w, 1m, 3m] } }
    WindowAnchor:
      name: window_anchor
      in: query
      required: false
      schema: { type: string, maxLength: 512 }
      description: Omit for fresh summary, reuse a server-issued paired window only; no client-selected timestamp.
    WindowAnchorRequired:
      name: window_anchor
      in: query
      required: true
      schema: { type: string, maxLength: 512 }
    ExpectedRevision:
      name: expected_revision
      in: query
      required: true
      schema: { type: string, maxLength: 512 }
      description: Card subject/scope revision for first page/detail; mismatch returns 409, never silently switches evidence.
  responses:
    Unauthorized: { description: Missing or expired scoped credential; never fall back to demo. }
    Restricted: { description: Bodyless access denied; no subject/listing existence, cohort, reason or source metadata hint. }
    NotFound: { description: Not visible, indistinguishable from absent. }
    Stale: { description: stale_window or stale_cursor; discard related pages/card and refetch. }
  schemas:
    DeviceChallenge:
      type: object
      additionalProperties: false
      required: [device_code, user_code, verification_uri, verification_uri_complete, verification_origins, expires_in, interval]
      properties:
        device_code: { type: string }
        user_code: { type: string }
        verification_uri: { type: string, format: uri }
        verification_uri_complete: { type: string, format: uri }
        verification_origins: { type: array, minItems: 1, maxItems: 1, items: { type: string, format: uri } }
        expires_in: { type: integer, minimum: 1 }
        interval: { type: integer, minimum: 1 }
    MobileDeviceToken:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, client_id, audience, scope, expires_in, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: bearer }
        client_id: { type: string, const: observal-mobile }
        audience: { type: string, const: observal-mobile-activity-v1 }
        scope: { type: string, const: 'mobile:read' }
        expires_in: { type: integer, minimum: 1 }
        user:
          type: object
          additionalProperties: false
          required: [id, email, name, role]
          properties:
            id: { type: string, format: uuid }
            email: { type: string, format: email }
            name: { type: string }
            role: { type: string }
    MobileTokenPair:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, client_id, audience, scope, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: bearer }
        client_id: { type: string, const: observal-mobile }
        audience: { type: string, const: observal-mobile-activity-v1 }
        scope: { type: string, const: 'mobile:read' }
        expires_in: { type: integer, minimum: 1 }
    MobileCredentialProof:
      type: object
      additionalProperties: false
      required: [token_type, client_id, audience, scope, subject_id, device_id]
      properties:
        token_type: { type: string, const: bearer }
        client_id: { type: string, const: observal-mobile }
        audience: { type: string, const: observal-mobile-activity-v1 }
        scope: { type: string, const: 'mobile:read' }
        subject_id: { type: string, format: uuid }
        device_id: { type: string }
    Coverage:
      type: object
      additionalProperties: false
      required: [eligible_sessions, source_start, source_end, supported_harnesses, supported_kinds, projection]
      properties:
        eligible_sessions: { type: [integer, 'null'], minimum: 0 }
        source_start: { type: [string, 'null'], format: date-time }
        source_end: { type: [string, 'null'], format: date-time }
        supported_harnesses: { type: array, maxItems: 32, items: { type: string } }
        supported_kinds: { type: array, maxItems: 3, items: { type: string, enum: [mcp_calls, confirmed_skill_loads, recorded_hook_runs] } }
        projection: { type: string, enum: [complete, partial, pending, unavailable] }
    Reading:
      oneOf:
        - { $ref: '#/components/schemas/SupportedReading' }
        - { $ref: '#/components/schemas/PartialReading' }
        - { $ref: '#/components/schemas/NotRecordedReading' }
      description: >-
        Partial is an observed lower bound spoken 'N observed traces · Partial coverage'.
        Supported zero requires complete declared cohort including zero-positive
        sessions. Partial zero is available only to self User for a retained,
        tool-free, v2-mapped Pi source with a prospective root witness and a
        currently visible historically approved component; it is not an Author,
        general-session or all-kinds zero. Individual restricted summary/detail reads and fully denied
        batches return bodyless HTTP 403; paired mixed batches use RestrictedScope
        without a reading or cohort. No installed-only/capability-only eligibility.
    ReadingBase:
      type: object
      additionalProperties: false
      required: [value, status, reasons, coverage]
      properties:
        value: { type: [integer, 'null'], minimum: 0, maximum: 9007199254740991 }
        status: { type: string, enum: [supported, partial, not_recorded] }
        reasons: { type: array, maxItems: 16, items: { type: string } }
        coverage: { $ref: '#/components/schemas/Coverage' }
    SupportedReading:
      allOf:
        - { $ref: '#/components/schemas/ReadingBase' }
        - { type: object, properties: { status: { const: supported }, value: { type: integer }, coverage: { type: object, properties: { projection: { const: complete } } } } }
    PartialReading:
      allOf:
        - { $ref: '#/components/schemas/ReadingBase' }
        - { type: object, properties: { status: { const: partial }, value: { type: integer }, coverage: { type: object, properties: { projection: { const: partial } } } } }
    NotRecordedReading:
      allOf:
        - { $ref: '#/components/schemas/ReadingBase' }
        - { type: object, properties: { status: { const: not_recorded }, value: { type: 'null' }, coverage: { type: object, properties: { projection: { enum: [pending, unavailable] } } } } }
    RedactedUnavailable:
      allOf:
        - { $ref: '#/components/schemas/Reading' }
        - type: object
          properties:
            value: { type: 'null' }
            status: { const: not_recorded }
            reasons: { const: [unavailable] }
            coverage:
              type: object
              properties:
                eligible_sessions: { type: 'null' }
                source_start: { type: 'null' }
                source_end: { type: 'null' }
                supported_harnesses: { const: [] }
                supported_kinds: { const: [] }
                projection: { const: unavailable }
      description: Shared neutral null for author general sessions and suppressed platform cohort.
    Window:
      type: object
      additionalProperties: false
      required: [start, end, as_of, timezone, period]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        as_of: { type: string, format: date-time }
        timezone: { const: UTC }
        period: { type: string, enum: [1w, 1m, 3m] }
      description: Half-open event-time 7/30/90-day bounds; platform ends at completed UTC midnight.
    Capabilities:
      type: object
      additionalProperties: false
      required: [contract, server_id, project_id, viewer_id, trace_headlines, supported_kinds, platform_overview]
      properties:
        contract: { const: mobile-activity-v1 }
        server_id: { type: string, format: uuid }
        project_id: { type: string }
        viewer_id: { type: string, format: uuid }
        trace_headlines: { type: boolean, description: MUST remain false until later running-instance Gate 1 qualification. }
        supported_kinds: { type: array, maxItems: 3, items: { type: string, enum: [mcp_calls, confirmed_skill_loads, recorded_hook_runs] } }
        platform_overview: { type: boolean }
    PairedRequest:
      type: object
      additionalProperties: false
      required: [subject_ids, period]
      properties:
        subject_ids: { type: array, minItems: 1, maxItems: 12, uniqueItems: true, items: { type: string, format: uuid } }
        period: { type: string, enum: [1w, 1m, 3m] }
        window_anchor: { type: string, maxLength: 512 }
    PairedBatch:
      type: object
      additionalProperties: false
      required: [window, window_anchor, items]
      properties:
        window: { $ref: '#/components/schemas/Window' }
        window_anchor: { type: string, maxLength: 512 }
        items: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/PairedPerson' } }
      description: >-
        One viewer/project/period window across batches; anchor pins time, NOT a
        global evidence revision. Each subject/scope revision invalidates only
        its own pages; unrelated writes cannot starve other cursors.
    RestrictedScope:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { const: restricted }
      description: No count, cohort, coverage, reason, or source hint; never treat as Not recorded.
    PairedScope:
      oneOf:
        - { $ref: '#/components/schemas/Reading' }
        - { $ref: '#/components/schemas/RestrictedScope' }
    PairedPerson:
      type: object
      additionalProperties: false
      required: [subject_id, author_revision, user_revision, author_usage, user_usage]
      properties:
        subject_id: { type: string, format: uuid }
        author_revision: { type: string, description: '"restricted" when Author scope is denied; no epoch or source fingerprint.' }
        user_revision: { type: string, description: '"restricted" when User scope is denied; no epoch or source fingerprint.' }
        author_usage: { $ref: '#/components/schemas/PairedScope' }
        user_usage: { $ref: '#/components/schemas/PairedScope' }
      allOf:
        - if: { properties: { author_usage: { properties: { status: { const: restricted } } } } }
          then: { properties: { author_revision: { const: restricted } } }
        - if: { properties: { user_usage: { properties: { status: { const: restricted } } } } }
          then: { properties: { user_revision: { const: restricted } } }
    PersonSummary:
      type: object
      additionalProperties: false
      required: [subject_id, scope, window, window_anchor, revision, component_trace_union, mcp_calls, confirmed_skill_loads, recorded_hook_runs, active_days_utc, general_sessions]
      properties:
        subject_id: { type: string, format: uuid }
        scope: { type: string, enum: [author, user] }
        window: { $ref: '#/components/schemas/Window' }
        window_anchor: { type: string }
        revision: { type: string }
        component_trace_union: { $ref: '#/components/schemas/Reading' }
        mcp_calls: { $ref: '#/components/schemas/Reading' }
        confirmed_skill_loads: { $ref: '#/components/schemas/Reading' }
        recorded_hook_runs: { $ref: '#/components/schemas/Reading' }
        active_days_utc: { $ref: '#/components/schemas/Reading' }
        general_sessions: { $ref: '#/components/schemas/Reading' }
      description: >-
        Author general_sessions MUST be RedactedUnavailable; user sessions
        require independently verified root prompt at/before in-window activity.
    ComponentObservation:
      type: object
      additionalProperties: false
      required: [kind, component_id, name, author, component_traces, mcp_calls, confirmed_skill_loads, recorded_hook_runs]
      properties:
        kind: { type: string, enum: [mcp, skill, hook] }
        component_id: { type: string, format: uuid }
        name: { type: string }
        author: { $ref: '#/components/schemas/PublicPerson' }
        component_traces: { $ref: '#/components/schemas/Reading' }
        mcp_calls: { $ref: '#/components/schemas/Reading' }
        confirmed_skill_loads: { $ref: '#/components/schemas/Reading' }
        recorded_hook_runs: { $ref: '#/components/schemas/Reading' }
    ComponentPage:
      type: object
      additionalProperties: false
      required: [subject_id, scope, window, window_anchor, revision, items, complete, next_cursor]
      properties:
        subject_id: { type: string, format: uuid }
        scope: { type: string, enum: [author, user] }
        window: { $ref: '#/components/schemas/Window' }
        window_anchor: { type: string }
        revision: { type: string }
        items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/ComponentObservation' } }
        complete: { type: boolean }
        next_cursor: { type: [string, 'null'] }
    ComponentDetail:
      type: object
      additionalProperties: false
      required: [subject_id, scope, window, window_anchor, revision, component]
      properties:
        subject_id: { type: string, format: uuid }
        scope: { type: string, enum: [author, user] }
        window: { $ref: '#/components/schemas/Window' }
        window_anchor: { type: string }
        revision: { type: string }
        component: { $ref: '#/components/schemas/ComponentObservation' }
    PublicPerson:
      type: object
      additionalProperties: false
      required: [id, username, name]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        name: { type: string }
    PeoplePage:
      type: object
      additionalProperties: false
      required: [items, complete, next_cursor]
      properties:
        items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/PublicPerson' } }
        complete: { type: boolean }
        next_cursor: { type: [string, 'null'] }
    PublishedItem:
      type: object
      additionalProperties: false
      required: [kind, id, name, is_current_owner]
      properties:
        kind: { type: string, enum: [mcp, skill, hook, prompt, sandbox, agent] }
        id: { type: string, format: uuid }
        name: { type: string }
        is_current_owner: { type: boolean }
    PublishedPage:
      type: object
      additionalProperties: false
      required: [items, complete, next_cursor]
      properties:
        items: { type: array, maxItems: 20, items: { $ref: '#/components/schemas/PublishedItem' } }
        complete: { type: boolean }
        next_cursor: { type: [string, 'null'] }
    PlatformOverview:
      type: object
      additionalProperties: false
      required: [window, revision, active_accounts, prompted_root_sessions]
      properties:
        window: { $ref: '#/components/schemas/Window' }
        revision: { type: string }
        active_accounts: { $ref: '#/components/schemas/Reading' }
        prompted_root_sessions: { $ref: '#/components/schemas/Reading' }
      allOf:
        - if:
            properties:
              active_accounts:
                properties:
                  value: { type: 'null' }
          then:
            properties:
              active_accounts: { $ref: '#/components/schemas/RedactedUnavailable' }
              prompted_root_sessions: { $ref: '#/components/schemas/RedactedUnavailable' }
        - if:
            properties:
              prompted_root_sessions:
                properties:
                  value: { type: 'null' }
          then:
            properties:
              active_accounts: { $ref: '#/components/schemas/RedactedUnavailable' }
              prompted_root_sessions: { $ref: '#/components/schemas/RedactedUnavailable' }
      description: >-
        If fewer than 10 distinct eligible accounts OR either reading cannot be
        honestly counted, BOTH are identical RedactedUnavailable. No metadata
        or suppressed-cohort timing distinguishers and no public permission.
